<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff" rx="12" />
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">High Availability: 2 Data Node + 1 Master-Only Node</text>

  <!-- Panel 1: Normal -->
  <text x="250" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Normal — status green</text>

  <rect x="60" y="85" width="130" height="130" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2" />
  <text x="125" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">es-node1</text>
  <text x="125" y="130" text-anchor="middle" font-size="12" fill="#065f46">P0</text>
  <text x="125" y="150" text-anchor="middle" font-size="12" fill="#065f46">R1</text>
  <text x="125" y="172" text-anchor="middle" font-size="10" fill="#047857">(data + master-eligible)</text>

  <rect x="205" y="85" width="130" height="130" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2" />
  <text x="270" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">es-node2</text>
  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#065f46">P1</text>
  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#065f46">R0</text>
  <text x="270" y="172" text-anchor="middle" font-size="10" fill="#047857">(data + master-eligible)</text>

  <rect x="350" y="85" width="130" height="130" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 3" />
  <text x="415" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">es-node3</text>
  <text x="415" y="132" text-anchor="middle" font-size="11" fill="#1e3a8a">(master-only)</text>
  <text x="415" y="150" text-anchor="middle" font-size="10.5" fill="#3b82f6">tanpa shard</text>
  <text x="415" y="167" text-anchor="middle" font-size="10.5" fill="#3b82f6">* elected master</text>

  <text x="250" y="242" text-anchor="middle" font-size="11.5" fill="#3f3f46">P0/P1 di node1/node2, tiap primary punya replica di node LAIN.</text>
  <text x="250" y="260" text-anchor="middle" font-size="11.5" fill="#3f3f46">node3 ikut kuorum master, TIDAK menyimpan shard.</text>

  <!-- Divider -->
  <line x1="500" y1="70" x2="500" y2="440" stroke="#e4e4e7" stroke-width="2" />

  <!-- Panel 2: Node down -->
  <text x="750" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">es-node2 Mati — status yellow, TETAP MELAYANI</text>

  <rect x="560" y="85" width="130" height="130" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
  <text x="625" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">es-node1</text>
  <text x="625" y="130" text-anchor="middle" font-size="12" fill="#78350f">P0</text>
  <text x="625" y="150" text-anchor="middle" font-size="12" fill="#78350f">P1 (promosi dari R1)</text>
  <text x="625" y="172" text-anchor="middle" font-size="10" fill="#b45309">satu-satunya data node hidup</text>

  <rect x="705" y="85" width="130" height="130" rx="10" fill="#fafafa" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="6 4" />
  <text x="770" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#71717a" text-decoration="line-through">es-node2</text>
  <text x="770" y="135" text-anchor="middle" font-size="11" fill="#a1a1aa">mati</text>
  <text x="770" y="155" text-anchor="middle" font-size="20" fill="#dc2626">&#10007;</text>

  <rect x="850" y="85" width="130" height="130" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 3" />
  <text x="915" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">es-node3</text>
  <text x="915" y="132" text-anchor="middle" font-size="11" fill="#1e3a8a">(master-only)</text>
  <text x="915" y="150" text-anchor="middle" font-size="10.5" fill="#3b82f6">tetap hidup, tanpa shard</text>
  <text x="915" y="167" text-anchor="middle" font-size="10.5" fill="#3b82f6">quorum 2/3 tetap terjaga</text>

  <text x="750" y="242" text-anchor="middle" font-size="11.5" fill="#3f3f46">R1 di node1 dipromosikan jadi primary P1 baru -&gt; unassigned_primary_shards: 0.</text>
  <text x="750" y="260" text-anchor="middle" font-size="11.5" fill="#3f3f46">Baca/tulis tetap jalan (dibuktikan nyata pada bagian d topik 3).</text>

  <rect x="60" y="300" width="920" height="150" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5" />
  <text x="80" y="326" font-size="13" font-weight="700" fill="#27272a">Kenapa node3 tidak menyimpan shard, tapi tetap krusial:</text>
  <text x="80" y="350" font-size="12.5" fill="#3f3f46">Quorum master butuh MAYORITAS node master-eligible. Dengan 3 node master-eligible (node1, node2, node3),</text>
  <text x="80" y="370" font-size="12.5" fill="#3f3f46">quorum = 2 dari 3 -&gt; cluster tetap bisa pilih master walau 1 mati (skenario di atas: node2 mati, node1+node3</text>
  <text x="80" y="390" font-size="12.5" fill="#3f3f46">masih quorum). Kalau cuma 2 node master-eligible, quorum = 2 dari 2 (harus BULAT) -&gt; kehilangan 1 = kehilangan</text>
  <text x="80" y="410" font-size="12.5" fill="#3f3f46">master sama sekali. node3 dibuat master-only (bukan data node penuh) supaya quorum ini murah secara RAM.</text>
  <text x="80" y="434" font-size="12.5" fill="#3f3f46">Kalau es-node3 sendiri yang mati (bukan node2): data TIDAK terganggu sama sekali (dia tidak pernah pegang shard).</text>
</svg>
