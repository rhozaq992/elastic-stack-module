<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="520" fill="#ffffff" rx="12" />
  <text x="520" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Atribut Tier Node: Default vs Eksplisit (Produksi)</text>

  <!-- Panel A: default -->
  <text x="255" y="62" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">A. Default (dipakai pada lab ini) — node.roles TIDAK dibatasi</text>

  <rect x="70" y="80" width="150" height="120" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2" />
  <text x="145" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">es-node1</text>
  <text x="145" y="122" text-anchor="middle" font-size="9.5" fill="#065f46">data_hot</text>
  <text x="145" y="138" text-anchor="middle" font-size="9.5" fill="#065f46">data_warm</text>
  <text x="145" y="154" text-anchor="middle" font-size="9.5" fill="#065f46">data_cold</text>
  <text x="145" y="170" text-anchor="middle" font-size="9.5" fill="#065f46">(semua tier sekaligus)</text>

  <rect x="240" y="80" width="150" height="120" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2" />
  <text x="315" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">es-node2</text>
  <text x="315" y="122" text-anchor="middle" font-size="9.5" fill="#065f46">data_hot</text>
  <text x="315" y="138" text-anchor="middle" font-size="9.5" fill="#065f46">data_warm</text>
  <text x="315" y="154" text-anchor="middle" font-size="9.5" fill="#065f46">data_cold</text>
  <text x="315" y="170" text-anchor="middle" font-size="9.5" fill="#065f46">(semua tier sekaligus)</text>

  <text x="255" y="222" text-anchor="middle" font-size="11" fill="#3f3f46">Index hot/warm/cold manapun SELALU</text>
  <text x="255" y="238" text-anchor="middle" font-size="11" fill="#3f3f46">menemukan node cocok -&gt; ILM tetap JALAN.</text>
  <text x="255" y="256" text-anchor="middle" font-size="10.5" fill="#71717a">(tapi TIDAK ada pemisahan hardware nyata)</text>

  <!-- Divider -->
  <line x1="510" y1="55" x2="510" y2="480" stroke="#e4e4e7" stroke-width="2" />

  <!-- Panel B: production explicit -->
  <text x="770" y="62" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">B. Produksi — node.roles tier DIBATASI eksplisit</text>

  <rect x="540" y="80" width="130" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text x="605" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Node Hot</text>
  <text x="605" y="122" text-anchor="middle" font-size="9.5" fill="#7f1d1d">node.roles=</text>
  <text x="605" y="136" text-anchor="middle" font-size="9.5" fill="#7f1d1d">data_hot,master</text>
  <text x="605" y="160" text-anchor="middle" font-size="9.5" fill="#991b1b">SSD/NVMe cepat</text>

  <rect x="685" y="80" width="130" height="110" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
  <text x="750" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Node Warm</text>
  <text x="750" y="122" text-anchor="middle" font-size="9.5" fill="#78350f">node.roles=</text>
  <text x="750" y="136" text-anchor="middle" font-size="9.5" fill="#78350f">data_warm</text>
  <text x="750" y="160" text-anchor="middle" font-size="9.5" fill="#78350f">disk lebih murah</text>

  <rect x="830" y="80" width="150" height="110" rx="10" fill="#fafafa" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="6 4" />
  <text x="905" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#52525b">Node Cold?</text>
  <text x="905" y="124" text-anchor="middle" font-size="9.5" fill="#71717a">TIDAK DIBUAT</text>
  <text x="905" y="145" text-anchor="middle" font-size="20" fill="#dc2626">&#10007;</text>

  <rect x="620" y="220" width="290" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="765" y="242" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">Index masuk fase cold -&gt; minta node data_cold</text>
  <text x="765" y="260" text-anchor="middle" font-size="10.5" fill="#7f1d1d">TIDAK ADA node yang cocok -&gt; shard</text>
  <text x="765" y="277" text-anchor="middle" font-size="10.5" fill="#7f1d1d">UNASSIGNED -&gt; cluster yellow/red</text>
  <text x="765" y="296" text-anchor="middle" font-size="10" fill="#991b1b">(sampai node data_cold ditambahkan)</text>

  <line x1="905" y1="190" x2="765" y2="220" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" />

  <rect x="540" y="330" width="440" height="150" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5" />
  <text x="560" y="352" font-size="12" font-weight="700" fill="#27272a">Kesimpulan:</text>
  <text x="560" y="374" font-size="11.5" fill="#3f3f46">Atribut tier itu OPSIONAL supaya ILM berfungsi (Panel A</text>
  <text x="560" y="392" font-size="11.5" fill="#3f3f46">membuktikan ini) -- tapi kalau Anda MEMBATASI node.roles</text>
  <text x="560" y="410" font-size="11.5" fill="#3f3f46">secara eksplisit demi hardware terpisah (Panel B), setiap</text>
  <text x="560" y="428" font-size="11.5" fill="#3f3f46">tier yang disebut policy ILM WAJIB punya node yang</text>
  <text x="560" y="446" font-size="11.5" fill="#3f3f46">menampungnya -- kalau tidak, shard macet UNASSIGNED.</text>
  <text x="560" y="468" font-size="11.5" font-weight="700" fill="#27272a">Jangan setengah jalan: batasi role, tapi lupa sediakan nodenya.</text>
</svg>
