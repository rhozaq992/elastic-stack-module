<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" fill="#ffffff" rx="12" />
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Cara Kerja APM pada Stack Ini</text>

  <defs>
    <marker id="arrowApm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8" />
    </marker>
    <marker id="arrowApmGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#047857" />
    </marker>
  </defs>

  <!-- Box 1: cart/payment -->
  <rect x="30" y="110" width="190" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" />
  <text x="125" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">cart / payment</text>
  <text x="125" y="160" text-anchor="middle" font-size="11" fill="#1e3a8a">APM agent di dalam kode</text>
  <text x="125" y="176" text-anchor="middle" font-size="11" fill="#1e3a8a">(Node.js / Python)</text>

  <!-- Arrow 1 -->
  <path d="M 220 150 L 275 150" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#arrowApm)" />
  <text x="247" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">trace</text>

  <!-- Box 2: apm-server -->
  <rect x="280" y="110" width="190" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" />
  <text x="375" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">apm-server</text>
  <text x="375" y="160" text-anchor="middle" font-size="11" fill="#1e3a8a">port 8200</text>
  <text x="375" y="176" text-anchor="middle" font-size="11" fill="#1e3a8a">terima data, kirim ke ES</text>

  <!-- Arrow 2 -->
  <path d="M 470 150 L 525 150" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#arrowApm)" />

  <!-- Box 3: Elasticsearch -->
  <rect x="530" y="110" width="200" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" />
  <text x="630" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Elasticsearch</text>
  <text x="630" y="158" text-anchor="middle" font-size="10.5" fill="#1e3a8a">index traces-apm-*,</text>
  <text x="630" y="174" text-anchor="middle" font-size="10.5" fill="#1e3a8a">metrics-apm-*</text>

  <!-- Arrow 3: ES <- Kibana read (bidirectional feel via double line) -->
  <path d="M 795 135 L 740 135" stroke="#047857" stroke-width="2.5" fill="none" marker-end="url(#arrowApmGreen)" />
  <text x="767" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">baca</text>

  <!-- Box 4: Kibana APM UI -->
  <rect x="800" y="110" width="170" height="80" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2" />
  <text x="885" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Kibana APM UI</text>
  <text x="885" y="160" text-anchor="middle" font-size="11" fill="#065f46">Service Inventory,</text>
  <text x="885" y="176" text-anchor="middle" font-size="11" fill="#065f46">detail transaksi/span</text>

  <!-- explanatory steps -->
  <rect x="30" y="220" width="940" height="90" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5" />
  <text x="50" y="240" font-size="12" fill="#27272a"><tspan font-weight="700">1. APM agent</tspan> — library di dalam kode aplikasi yang mencatat tiap request masuk (<tspan font-weight="700">transaction</tspan>) dan tiap</text>
  <text x="50" y="255" font-size="12" fill="#27272a">operasi di dalamnya (<tspan font-weight="700">span</tspan>), lalu mengirim data itu ke APM Server.</text>
  <text x="50" y="273" font-size="12" fill="#27272a"><tspan font-weight="700">2. APM Server</tspan> — menyimpan data dari semua agent ke Elasticsearch sebagai index <tspan font-family="monospace">traces-apm-*</tspan> dan <tspan font-family="monospace">metrics-apm-*</tspan>.</text>
  <text x="50" y="291" font-size="12" fill="#27272a"><tspan font-weight="700">3. Kibana APM UI</tspan> — membaca index tersebut sebagai tabel per-service &amp; grafik latency — datanya tetap dapat di-query manual.</text>
</svg>
