<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff" rx="12" />
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Terminologi APM: Trace, Transaction, Span</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#52525b">Data nyata dari satu trace POST /pay/&lt;id&gt; pada stack Anda (904ms total)</text>

  <!-- Row 1: trace container -->
  <text x="70" y="88" font-size="12" font-weight="700" fill="#3f3f46">trace</text>
  <rect x="70" y="96" width="860" height="36" rx="6" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="930" y="118" font-size="11" fill="#52525b">904ms</text>

  <!-- Row 2: transaction bar -->
  <text x="70" y="150" font-size="12" font-weight="700" fill="#1e3a8a">transaction (service: payment)</text>
  <rect x="70" y="158" width="860" height="34" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" />
  <text x="500" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">POST /pay/&lt;id&gt; — 904ms</text>

  <!-- Row 3: spans (proportional to real duration/offset within the transaction) -->
  <text x="70" y="216" font-size="12" font-weight="700" fill="#065f46">span (operasi anak di dalam transaction)</text>

  <!-- span: GET user:8080 -- offset 0.75ms, duration 3.1ms (drawn at min width for visibility) -->
  <rect x="71" y="224" width="6" height="28" rx="3" fill="#a7f3d0" stroke="#047857" stroke-width="1.5" />
  <line x1="77" y1="238" x2="140" y2="238" stroke="#047857" stroke-width="1" stroke-dasharray="2,2" />
  <text x="144" y="242" font-size="11" fill="#065f46">GET user:8080 — 3.1ms</text>

  <!-- span: GET payment-gateway -- offset 4.2ms, duration 856.8ms (dominant, ~95%) -->
  <rect x="74" y="224" width="815" height="28" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="2" />
  <text x="481" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">GET payment-gateway — 856.8ms (95% durasi trace)</text>

  <!-- span: DELETE cart:8080 -- offset 863.4ms, duration 39ms -->
  <rect x="891" y="224" width="37" height="28" rx="3" fill="#a7f3d0" stroke="#047857" stroke-width="1.5" />
  <line x1="891" y1="238" x2="830" y2="266" stroke="#047857" stroke-width="1" stroke-dasharray="2,2" />
  <text x="700" y="278" font-size="11" fill="#065f46">DELETE cart:8080 — 39ms</text>

  <!-- explanatory legend -->
  <rect x="30" y="296" width="940" height="94" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5" />
  <text x="50" y="316" font-size="12" fill="#27272a"><tspan font-weight="700">Trace</tspan> — SELURUH perjalanan satu request pengguna, dari ujung ke ujung (garis putus-putus abu-abu di atas). Satu trace bisa melewati BANYAK service.</text>
  <text x="50" y="334" font-size="12" fill="#27272a"><tspan font-weight="700">Transaction</tspan> — unit kerja tingkat-atas yang dicatat agent PADA SATU service (di sini: request masuk ke <tspan font-family="monospace">payment</tspan>). Satu trace berisi satu transaction per service yang dilewati.</text>
  <text x="50" y="352" font-size="12" fill="#27272a"><tspan font-weight="700">Span</tspan> — operasi ANAK di dalam satu transaction (panggilan keluar ke service/DB lain). Satu transaction bisa berisi banyak span, tersusun sesuai urutan panggilan nyata di kode.</text>
  <text x="50" y="374" font-size="12" fill="#27272a">Pada trace ini: span <tspan font-family="monospace">GET payment-gateway</tspan> mendominasi 95% durasi — bukti <tspan font-family="monospace">payment</tspan> lambat karena MENUNGGU dependency eksternal, bukan kode sendiri.</text>
</svg>
