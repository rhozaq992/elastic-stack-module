<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff" rx="12" />
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Analogi Scoring: Nilai Dasar + Bonus</text>

  <rect x="60" y="55" width="880" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" />
  <text x="500" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Skor Akhir  =  Skor Dasar (relevansi teks, BM25)  +  Bonus (function_score / boost)</text>

  <!-- Panel 1: Sebelum -->
  <text x="250" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#3f3f46">Sebelum boost — hanya skor dasar</text>
  <text x="250" y="150" text-anchor="middle" font-size="11.5" fill="#71717a">query match("categories": "Robot") — semua dapat skor SAMA</text>

  <line x1="90" y1="290" x2="410" y2="290" stroke="#a1a1aa" stroke-width="2" />
  <rect x="110" y="260" width="60" height="30" rx="4" fill="#d4d4d8" />
  <text x="140" y="280" text-anchor="middle" font-size="11" fill="#3f3f46">0.262</text>
  <rect x="200" y="260" width="60" height="30" rx="4" fill="#d4d4d8" />
  <text x="230" y="280" text-anchor="middle" font-size="11" fill="#3f3f46">0.262</text>
  <rect x="290" y="260" width="60" height="30" rx="4" fill="#d4d4d8" />
  <text x="320" y="280" text-anchor="middle" font-size="11" fill="#3f3f46">0.262</text>
  <text x="140" y="305" text-anchor="middle" font-size="10.5" fill="#52525b">Stan</text>
  <text x="230" y="305" text-anchor="middle" font-size="10.5" fill="#52525b">RMC</text>
  <text x="320" y="305" text-anchor="middle" font-size="10.5" fill="#52525b">HPTD</text>

  <text x="250" y="335" text-anchor="middle" font-size="11.5" fill="#3f3f46">Urutan hasil TIDAK MENCERMINKAN</text>
  <text x="250" y="352" text-anchor="middle" font-size="11.5" fill="#3f3f46">produk mana yang ratingnya lebih baik.</text>

  <!-- Arrow -->
  <path d="M 445 220 L 545 220" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)" />
  <text x="495" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">+ bonus rating</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8" />
    </marker>
  </defs>

  <!-- Panel 2: Sesudah -->
  <text x="750" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Sesudah boost — skor dasar + bonus rating</text>
  <text x="750" y="150" text-anchor="middle" font-size="11.5" fill="#047857">function_score(field_value_factor: avg_rating)</text>

  <line x1="590" y1="290" x2="910" y2="290" stroke="#a1a1aa" stroke-width="2" />
  <rect x="610" y="185" width="60" height="105" rx="4" fill="#6ee7b7" stroke="#047857" stroke-width="1.5" />
  <text x="640" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">2.054</text>
  <rect x="700" y="215" width="60" height="75" rx="4" fill="#a7f3d0" stroke="#047857" stroke-width="1.5" />
  <text x="730" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">1.948</text>
  <rect x="790" y="245" width="60" height="45" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5" />
  <text x="820" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">1.872</text>
  <text x="640" y="305" text-anchor="middle" font-size="10.5" fill="#052e16">RMC (rating 5)</text>
  <text x="730" y="305" text-anchor="middle" font-size="10.5" fill="#052e16">Stan (rating 5)</text>
  <text x="820" y="305" text-anchor="middle" font-size="10.5" fill="#052e16">HPTD (rating 4.3)</text>

  <text x="750" y="335" text-anchor="middle" font-size="11.5" fill="#3f3f46">Urutan berubah SESUAI besar bonus —</text>
  <text x="750" y="352" text-anchor="middle" font-size="11.5" fill="#3f3f46">produk dengan bonus lebih besar naik ke atas.</text>

  <rect x="60" y="380" width="880" height="60" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5" />
  <text x="80" y="404" font-size="12.5" fill="#27272a">function_score/boost menghitung skor akhir lewat penjumlahan/perkalian angka berdasarkan nilai field bisnis</text>
  <text x="80" y="424" font-size="12.5" fill="#27272a">(mis. avg_rating) — rumusnya dapat dihitung manual di kertas, dan hasilnya dapat diprediksi sepenuhnya.</text>
</svg>
