# Robot Shop -- aplikasi microservice e-commerce contoh, dipakai sebagai
# studi kasus Sesi 4, 6, dan 7. Semua image di bawah sudah PRE-BUILT
# (multi-arch: amd64 + arm64) -- Anda HANYA menjalankan `docker compose up`,
# tidak perlu build/compile apa pun. Lihat robot-shop-structure.md untuk
# penjelasan arsitekturnya.
services:
  mongodb:
    image: shirojack/rs-mongodb:v2
    networks: [robot-shop]
  redis:
    image: redis:6.2-alpine
    networks: [robot-shop]
  rabbitmq:
    image: rabbitmq:3.8-management-alpine
    networks: [robot-shop]
  payment-gateway:
    # Dummy payment gateway lokal -- MENGGANTIKAN pemanggilan nyata ke
    # situs eksternal (default upstream Robot Shop memanggil paypal.com).
    # Sengaja diberi delay respons ~850ms supaya tetap merepresentasikan
    # dependency eksternal yang lambat (dipakai lagi di Sesi 6 untuk
    # latihan analisis APM), tanpa benar-benar menghubungi internet.
    image: python:3.13-alpine
    networks: [robot-shop]
    command:
      - python3
      - -c
      - |
        import http.server, time
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                time.sleep(0.85)
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'OK')
            def log_message(self, *a):
                pass
        http.server.HTTPServer(('0.0.0.0', 80), H).serve_forever()
  catalogue:
    image: shirojack/rs-catalogue:v2
    depends_on: [mongodb]
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 3
  user:
    image: shirojack/rs-user:v2
    depends_on: [mongodb, redis]
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 3
  cart:
    image: shirojack/rs-cart:v2-apm
    depends_on:
      redis:
        condition: service_started
      apm-server:
        condition: service_healthy
    environment:
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_ENVIRONMENT: training
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 3
  mysql:
    image: shirojack/rs-mysql-db:v2
    cap_add: [NET_ADMIN]
    networks: [robot-shop]
  shipping:
    image: shirojack/rs-shipping:v2
    depends_on: [mysql]
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 3
  ratings:
    image: shirojack/rs-ratings:v2
    environment:
      APP_ENV: prod
    depends_on: [mysql]
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/_health"]
      interval: 10s
      timeout: 10s
      retries: 3
  payment:
    image: shirojack/rs-payment:v2-apm
    depends_on:
      rabbitmq:
        condition: service_started
      apm-server:
        condition: service_healthy
      payment-gateway:
        condition: service_started
    environment:
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_ENVIRONMENT: training
      PAYMENT_GATEWAY: http://payment-gateway/
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 3
  dispatch:
    image: shirojack/rs-dispatch:v2
    depends_on: [rabbitmq]
    networks: [robot-shop]
  web:
    image: shirojack/rs-web:v2
    depends_on:
      # cart WAJIB service_healthy -- nginx resolve semua upstream lewat
      # DNS satu kali saat boot dan TIDAK retry; kalau cart belum listen
      # di 8080, web langsung crash permanen (nginx: [emerg] host not
      # found in upstream "cart"). catalogue/user/shipping/payment cukup
      # service_started -- JANGAN diubah ke service_healthy, shipping/
      # ratings butuh 1-2 menit untuk sehat (inisialisasi MySQL), lebih
      # lama dari retry healthcheck web.
      cart:
        condition: service_healthy
      catalogue:
        condition: service_started
      user:
        condition: service_started
      shipping:
        condition: service_started
      payment:
        condition: service_started
    ports:
      - "8080:8080"
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 10s
      retries: 3

  apm-server:
    image: docker.elastic.co/apm/apm-server:9.5.2
    container_name: elk-lab-apm-server
    volumes:
      - ./apm-server/apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    command: >
      -e --strict.perms=false
      -E output.elasticsearch.hosts=["elasticsearch:9200"]
      -E setup.kibana.host=kibana:5601
    ports:
      - "8200:8200"
    networks: [robot-shop, elk-lab-net]
    healthcheck:
      # image apm-server tidak punya curl/wget -- pakai bash /dev/tcp
      # sebagai pengecekan port terbuka (bash ADA di image ini).
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8200' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:9.5.2
    container_name: elk-lab-metricbeat-rs
    user: root
    volumes:
      - ./metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
    depends_on: [mongodb, mysql, redis, rabbitmq]
    networks: [robot-shop, elk-lab-net]

  logstash-rs:
    image: docker.elastic.co/logstash/logstash:9.5.2
    container_name: elk-lab-logstash-rs
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
      - xpack.monitoring.enabled=false
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks: [robot-shop, elk-lab-net]

  filebeat-rs:
    image: docker.elastic.co/beats/filebeat:9.5.2
    container_name: elk-lab-filebeat-rs
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash-rs
    networks: [robot-shop]

networks:
  robot-shop:
  elk-lab-net:
    external: true
