# Robot Shop -- aplikasi microservice e-commerce contoh, dipakai sebagai
# studi kasus Sesi 4, 6, dan 7. Semua image di bawah sudah PRE-BUILT
# (multi-arch: amd64 + arm64) -- Anda HANYA menjalankan `docker compose up`,
# tidak perlu build/compile apa pun. Lihat robot-shop-structure.md untuk
# penjelasan arsitekturnya.
services:
  mongodb:
    image: shirojack/rs-mongodb:v2
    networks: [robot-shop]
  redis:
    image: redis:6.2-alpine
    networks: [robot-shop]
  rabbitmq:
    image: rabbitmq:3.8-management-alpine
    ports:
      - "15672:15672"
    networks: [robot-shop]
  payment-gateway:
    # Dummy payment gateway lokal -- MENGGANTIKAN pemanggilan nyata ke
    # situs eksternal (default upstream Robot Shop memanggil paypal.com).
    # Sengaja diberi delay respons ~850ms supaya tetap merepresentasikan
    # dependency eksternal yang lambat (dipakai lagi di Sesi 6 untuk
    # latihan analisis APM), tanpa benar-benar menghubungi internet.
    image: python:3.13-alpine
    networks: [robot-shop]
    command:
      - python3
      - -c
      - |
        import http.server, time
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                time.sleep(0.85)
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b'OK')
            def log_message(self, *a):
                pass
        http.server.HTTPServer(('0.0.0.0', 80), H).serve_forever()
  catalogue:
    image: shirojack/rs-catalogue:v2
    depends_on: [mongodb]
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 3
  user:
    image: shirojack/rs-user:v2
    depends_on: [mongodb, redis]
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 3
  cart:
    image: shirojack/rs-cart:v2
    depends_on: [redis]
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 3
  mysql:
    image: shirojack/rs-mysql-db:v2
    cap_add: [NET_ADMIN]
    networks: [robot-shop]
  shipping:
    image: shirojack/rs-shipping:v2
    depends_on: [mysql]
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 3
  ratings:
    image: shirojack/rs-ratings:v2
    environment:
      APP_ENV: prod
    depends_on: [mysql]
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/_health"]
      interval: 10s
      timeout: 10s
      retries: 3
  payment:
    image: shirojack/rs-payment:v2
    depends_on: [rabbitmq, payment-gateway]
    environment:
      PAYMENT_GATEWAY: http://payment-gateway/
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 3
  dispatch:
    image: shirojack/rs-dispatch:v2
    depends_on: [rabbitmq]
    networks: [robot-shop]
  web:
    image: shirojack/rs-web:v2
    depends_on: [catalogue, user, shipping, payment]
    ports:
      - "8080:8080"
    networks: [robot-shop]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 10s
      retries: 3

networks:
  robot-shop:
