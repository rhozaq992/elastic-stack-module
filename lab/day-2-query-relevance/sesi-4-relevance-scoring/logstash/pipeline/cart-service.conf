# Custom pipeline: parse log container `cart` (Robot Shop).
# Input bersama ada di 00-input.conf (beats, diisi oleh filebeat-rs).
#
# Beda dengan payment (plain text, butuh grok), log cart SUDAH berbentuk
# JSON per baris dari aplikasinya sendiri (Node.js + pino/bunyan-style logger):
#   {"level":"info","time":1787687810568,"req":{...},"res":{"statusCode":200},
#    "responseTime":1,"msg":"request completed","v":1}
# Filebeat (parser `container`) sudah membuang envelope Docker-nya, jadi
# `[message]` di sini persis string JSON app di atas — tinggal satu json
# filter, tidak perlu grok.

filter {
  if [message] =~ "\"msg\":\"request completed\"" {
    json {
      source => "message"
      target => "cart"
      tag_on_failure => ["_json_cart_failed"]
    }

    if "_json_cart_failed" not in [tags] {
      # Contoh mutate filter: rename field supaya konsisten dengan konvensi
      # snake_case index lain di lab ini, sekaligus convert eksplisit ke
      # integer (defensif — walau JSON aslinya sudah numeric, praktik umum
      # di pipeline nyata untuk memastikan mapping ES tidak meleset kalau
      # suatu saat sumber datanya berubah jadi string).
      mutate {
        rename => { "[cart][responseTime]" => "[cart][response_time_ms]" }
        convert => { "[cart][response_time_ms]" => "integer" }
        add_field => { "log_type" => "cart_access" }
      }
    }
  }
}

output {
  if [log_type] == "cart_access" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "cart-service-parsed-%{+YYYY.MM.dd}"
    }
  }
}
