# Custom pipeline: parse log container `payment` (Robot Shop).
# Input bersama ada di 00-input.conf (beats, diisi oleh filebeat-rs —
# lihat penjelasan arsitektur di README bagian c).
#
# CATATAN JUJUR soal data asli: log payment Robot Shop TIDAK punya field
# literal "transaction_id" — service ini cuma nge-log dua jenis baris
# berbeda ke stdout/stderr:
#   1. Baris akses uWSGI:
#      [pid: 6|app: 0|req: 46/46] 172.19.0.13 () {...} [Tue Aug 25 ...]
#        POST /pay/anonymous-4 => generated 51 bytes in 688 msecs (HTTP/1.1 200) ...
#   2. Baris dict Python (order detail):
#      [2026-08-25 19:56:44,474] INFO in payment: {'total': 2907.55, 'tax': ...}
#
# Jadi field yang diekstrak di sini pakai identifier yang BENERAN ada di
# data: `payment_user` (dari path /pay/<user>), `http_status`,
# `response_time_ms` (dari baris akses), dan `amount` (dari baris dict) —
# bukan transaction_id yang sebenarnya tidak pernah di-log oleh service ini.

filter {
  if [message] =~ "INFO in payment: \{" {
    grok {
      match => { "message" => "INFO in payment: \{'total': %{NUMBER:amount:float}, 'tax': %{NUMBER:tax:float}" }
      tag_on_failure => ["_grok_payment_amount_failed"]
    }
    mutate { add_field => { "log_type" => "payment_amount" } }
  } else if [message] =~ "POST /pay/" {
    grok {
      match => { "message" => "POST /pay/%{DATA:payment_user} => generated %{NUMBER:response_bytes} bytes in %{NUMBER:response_time_ms:float} msecs \(HTTP/1\.1 %{NUMBER:http_status:int}\)" }
      tag_on_failure => ["_grok_payment_access_failed"]
    }
    mutate { add_field => { "log_type" => "payment_access" } }
  }
}

output {
  if [log_type] == "payment_amount" or [log_type] == "payment_access" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "payment-service-parsed-%{+YYYY.MM.dd}"
    }
  }
}
