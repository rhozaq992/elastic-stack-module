# WAJIB apabila perangkat Anda ARM (Apple Silicon) -- lihat prerequisites.md
# langkah 1 untuk cara memeriksa arsitektur perangkat Anda.
#
# Kenapa perlu ini: 9 dari 10 image Robot Shop custom-built multi-arch
# (berjalan native di ARM maupun amd64). SATU pengecualian: `mysql` (base
# image `mysql:5.7`) tidak memiliki varian arm64 sama sekali -- periksa
# sendiri lewat `docker manifest inspect mysql:5.7` apabila ingin
# memastikan. Force platform amd64 di bawah ini membuat Docker Desktop
# menjalankannya lewat emulasi (Rosetta di Mac / QEMU) -- tetap berfungsi
# normal, hanya startup-nya sedikit lebih lambat dari service lain.
#
# Apabila perangkat Anda x86/amd64, file override ini TIDAK diperlukan
# sama sekali -- mysql sudah native di arsitektur tersebut.
services:
  mysql:
    platform: linux/amd64
