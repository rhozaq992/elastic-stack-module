# Custom pipeline: parsing data ISO 8583 hasil terjemahan (JSON) dari
# translator (lihat generate_iso8583_stream.py -> parsed_transactions.jsonl).
# Input bersama ada di 00-input.conf (beats).
#
# BEDA dengan payment-service.conf/cart-service.conf (Sesi 8) yang wajib
# pakai GROK karena sumber datanya teks bebas (uWSGI access log, dict
# Python) -- di sini datanya SUDAH terstruktur JSON sejak dari translator,
# jadi cukup filter `json`. Kontras ini sengaja dipertahankan buat bahan
# ajar: grok kalau sumbernya teks bebas, json kalau sumbernya sudah
# terstruktur.
#
# Catatan timestamp: field asli dari translator sudah punya key literal
# "@timestamp" (string ISO8601 UTC). "@timestamp" adalah reserved field di
# Logstash -- begitu filter `json` selesai decode, Logstash OTOMATIS
# memakai value ini sebagai event timestamp, TIDAK perlu filter `date`
# terpisah.
filter {
  if [message] =~ "transaction_id" {
    json {
      source => "message"
      tag_on_failure => ["_jsonparsefailure_iso8583"]
    }
    mutate {
      add_field => { "log_type" => "iso8583_transaction" }
      remove_field => ["message"]
    }
  }
}

output {
  if [log_type] == "iso8583_transaction" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "iso8583-transactions-%{+YYYY.MM.dd}"
    }
  }
}
