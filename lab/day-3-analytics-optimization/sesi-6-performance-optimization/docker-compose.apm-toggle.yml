# Override SEMENTARA untuk mematikan APM agent pada `payment` -- dipakai
# HANYA untuk demonstrasi "sebelum ada APM vs sesudah ada APM" (README
# bagian d topik 3). Mematikan lewat env var, BUKAN dengan mengubah kode
# `payment.py` -- ini justru membuktikan bahwa agent APM sudah terpasang
# di image `:v2-apm` sejak awal, tinggal diaktifkan/nonaktifkan lewat
# config, tanpa peserta perlu menyentuh source code sama sekali.
#
# File ini di-merge ke docker-compose.yml Sesi 4 -- WAJIB dijalankan dari
# direktori sesi-4-relevance-scoring (lihat README bagian d topik 3 sesi
# ini untuk perintah lengkap). Untuk MENGAKTIFKAN kembali APM `payment`,
# jalankan ulang `docker compose up -d payment` TANPA menyertakan file
# override ini di daftar `-f` -- otomatis kembali ke konfigurasi normal
# (APM aktif) dari docker-compose.yml Sesi 4.
services:
  payment:
    environment:
      ELASTIC_APM_ENABLED: "false"
