# Load generator Robot Shop -- traffic nyata untuk latihan performance
# tuning. NUM_CLIENTS default image cuma 1 (terlalu kecil), dinaikkan di
# sini. ERROR=1 mengaktifkan transaksi anomali bawaan Robot Shop (task
# `error()` di load generator) -- frekuensinya sudah diatur rendah lewat
# task weight di dalam image (bukan lewat env var), lihat README sesi ini
# dan exercise/sesi-8 untuk cara menganalisisnya.
services:
  load:
    image: shirojack/rs-load:v2
    environment:
      HOST: http://web:8080
      NUM_CLIENTS: 6
      ERROR: 1
    networks: [robot-shop]

networks:
  robot-shop:
    external: true
    name: sesi-4-relevance-scoring_robot-shop
