# Input BERSAMA untuk payment-service.conf dan cart-service.conf.
#
# Kenapa tidak `file { path => "/var/lib/docker/containers/..." }` langsung
# di Logstash (seperti dugaan awal)? Karena direktori itu di host permission-nya
# `drwx--x--- root:root` — cuma root yang bisa LIST isinya (butuh bit 'r' pada
# directory buat resolve glob `*/*-json.log`), sementara Logstash MENOLAK
# dijalankan sebagai root ("Logstash cannot be run as superuser", beda dari
# Filebeat yang mengizinkannya via --strict.perms=false).
#
# Fix arsitektural (juga lebih idiomatik): pola Filebeat -> Logstash -> ES.
# Filebeat (day-4-filebeat/, jalan sebagai root, pola sama seperti Day 1)
# yang baca file container log langsung, lalu ship ke Logstash lewat port
# beats 5044 -- Logstash sendiri tidak pernah sentuh filesystem host.
input {
  beats {
    port => 5044
  }
}
