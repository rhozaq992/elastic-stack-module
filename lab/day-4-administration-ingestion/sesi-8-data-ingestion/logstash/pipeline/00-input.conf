# Input BERSAMA untuk payment-service.conf dan cart-service.conf.
#
# Kenapa tidak `file { path => "/var/lib/docker/containers/..." }` langsung
# di Logstash? Direktori itu di host permission-nya `drwx--x--- root:root` —
# cuma root yang bisa LIST isinya (butuh bit 'r' pada directory buat resolve
# glob `*/*-json.log`), sementara Logstash MENOLAK dijalankan sebagai root
# ("Logstash cannot be run as superuser", beda dari Filebeat yang
# mengizinkannya via --strict.perms=false).
#
# Pola yang dipakai: Filebeat (service filebeat-sesi8, jalan sebagai root)
# yang baca file container log langsung, lalu ship ke Logstash lewat port
# beats 5044 -- Logstash sendiri tidak pernah sentuh filesystem host.
input {
  beats {
    port => 5044
  }
}
