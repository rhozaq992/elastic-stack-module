# Custom pipeline: parse log container `web` (Robot Shop, Day 3) — Nginx
# reverse proxy di depan seluruh microservice.
# Input bersama ada di 00-input.conf (beats, diisi oleh Filebeat Day 4).
#
# Use case ketiga yang beda dari payment (custom text/grok manual) dan
# cart (JSON): `web` nge-log access line dalam format STANDAR industri,
# Apache/Nginx Combined Log Format (+field tambahan X-Forwarded-For di akhir):
#   172.19.0.14 - - [26/Aug/2026:03:58:16 +0000] "POST /api/user/login HTTP/1.1" 200 92 "-" "python-requests/2.32.5" "60.242.161.215"
# Karena ini format standar, Logstash sudah punya grok pattern BUILT-IN
# (%{COMBINEDAPACHELOG}) — tidak perlu tulis regex manual per field seperti
# payment_access. Ini pola paling umum dipakai di pipeline nyata untuk
# parsing access log web server (Nginx/Apache/dsb.).
#
# CATATAN ECS: image Logstash 9.5.2 default pakai ecs_compatibility v8, jadi
# %{COMBINEDAPACHELOG} menghasilkan field nested `http.response.status_code`
# dan `http.response.body.bytes` (SUDAH numeric/long dari grok-nya sendiri,
# bukan `response`/`bytes` flat seperti versi Logstash lama) — tidak perlu
# mutate/convert tambahan.
#
# CATATAN JUJUR: container `ratings` (PHP/Apache) JUGA nge-log access line
# berformat sama persis (lihat komentar di README), tapi karena Filebeat
# Day 4 kirim log SEMUA container tanpa filter nama container (lihat
# filebeat-day4/filebeat.yml), filter berbasis ISI PESAN (bukan nama
# container) di bawah ini otomatis menangkap access log dari KEDUA
# container itu sekaligus — pola nyata yang sering terjadi di pipeline
# produksi kalau beberapa service kebetulan nge-log format yang sama.

filter {
  if [message] =~ "HTTP/1\.[01]\" \d+ \d+" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
      tag_on_failure => ["_grok_web_access_failed"]
    }

    if "_grok_web_access_failed" not in [tags] {
      mutate {
        add_field => { "log_type" => "web_access" }
      }
    }
  }
}

output {
  if [log_type] == "web_access" {
    elasticsearch {
      hosts => ["http://es-node1:9200", "http://es-node2:9200", "http://es-node3:9200"]
      index => "web-service-parsed-%{+YYYY.MM.dd}"
    }
  }
}
