# Config ElastAlert2 -- rule engine open source (Apache 2.0,
# github.com/jertel/elastalert2) yang jadi "logic pengiriman data dari ELK
# ke Telegram" pada sesi ini. Lihat README bagian d topik 7 untuk cara
# membuat rule baru; jangan ubah file ini kecuali diminta.
rules_folder: /opt/elastalert/rules
run_every:
  seconds: 30
buffer_time:
  minutes: 5
es_host: elasticsearch
es_port: 9200
use_ssl: false
writeback_index: elastalert_status
alert_time_limit:
  days: 2
