# Parsing log host palsu (auth.log, bash_history) dari log-generator/ --
# pola grok-nya sama seperti yang dipelajari di README bagian d topik 3
# (instalasi manual), bedanya di sini outputnya benar-benar masuk
# Elasticsearch (index host-security-parsed-*), bukan cuma stdout, supaya
# bisa dipakai ElastAlert2 (lihat README bagian d topik 6-7).
filter {
  if [log_source] == "ssh_auth" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host} %{DATA:process}\[%{NUMBER:pid}\]: %{GREEDYDATA:auth_message}" }
      tag_on_failure => ["_grok_auth_base_failed"]
    }
    if [process] == "sshd" and [auth_message] =~ "^Accepted" {
      grok {
        match => { "auth_message" => "Accepted %{WORD:auth_method} for %{USERNAME:ssh_user} from %{IP:src_ip} port %{NUMBER:src_port:int} ssh2" }
      }
      mutate { add_field => { "log_type" => "ssh_login_success" } }
    } else if [process] == "sshd" and [auth_message] =~ "^Failed password" {
      grok {
        match => { "auth_message" => "Failed password for (invalid user )?%{USERNAME:ssh_user} from %{IP:src_ip} port %{NUMBER:src_port:int} ssh2" }
      }
      mutate { add_field => { "log_type" => "ssh_login_failed" } }
    } else if [process] == "useradd" and [auth_message] =~ "^new user" {
      grok {
        match => { "auth_message" => "new user: name=%{USERNAME:new_username}, UID=%{NUMBER:new_uid:int}, GID=%{NUMBER:new_gid:int}, home=%{PATH:new_home}, shell=%{PATH:new_shell}" }
      }
      mutate { add_field => { "log_type" => "user_created" } }
    }
  } else if [log_source] == "bash_history" {
    grok {
      match => { "message" => "%{GREEDYDATA:command}" }
    }
    if [command] =~ "(?i)(/etc/shadow|/etc/passwd|id_rsa|\.env|mysql -u root)" {
      mutate { add_field => { "log_type" => "bash_history_sensitive" } }
    } else {
      mutate { add_field => { "log_type" => "bash_history" } }
    }
  }
}

output {
  if [log_type] in ["ssh_login_success", "ssh_login_failed", "user_created", "bash_history", "bash_history_sensitive"] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "host-security-parsed-%{+YYYY.MM.dd}"
    }
  }
}
