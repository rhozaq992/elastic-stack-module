# decoded.jsonl sudah berbentuk JSON bersih (hasil decoder Go moov-io/iso8583)
# -- filter di sini cuma tipe-konversi numeric & buang field housekeeping
# Filebeat/Logstash, bukan parsing grok (beda dari host-security.conf).
filter {
  mutate {
    convert => { "amount" => "integer" }
    remove_field => ["agent", "ecs", "log", "input", "host", "@version", "tags", "event"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "iso8583-switch-%{+YYYY.MM.dd}"
  }
}
