# Filebeat kirim log SEMUA container ke Logstash (bukan langsung ke
# Elasticsearch) -- Logstash yang menyaring & mem-parsing baris dari
# container payment/cart/web lewat kondisi filter di masing-masing .conf.
filebeat.inputs:
  - type: filestream
    id: sesi7-all-container-logs
    paths:
      - "/var/lib/docker/containers/*/*.log"
    parsers:
      - container: ~

output.logstash:
  hosts: ["logstash-sesi7:5044"]

logging.level: info
logging.to_stderr: true
